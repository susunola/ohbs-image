name: cloud-acceptance-matrix

# Scheduled runs are opt-in and rotate one profile through L1/L2 each week.
# Manual full matrices remain bounded by max_jobs and protected reviewers.
on:
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:
    inputs:
      tier:
        description: Matrix breadth
        type: choice
        options: [rotation, representative, full]
        default: rotation
      max_jobs:
        description: Hard cap on billed builds (1-26)
        type: number
        default: 2
      confirm_cost:
        description: I approve billed cloud resources for at most max_jobs builds
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-acceptance-matrix
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event_name == 'schedule' && vars.OHBS_ENABLE_CLOUD_MATRIX == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_cost == true)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        env:
          MATRIX_TIER: ${{ github.event_name == 'schedule' && 'rotation' || inputs.tier }}
          MATRIX_MAX_JOBS: ${{ github.event_name == 'schedule' && '2' || inputs.max_jobs }}
        run: python scripts/acceptance_matrix.py --tier "$MATRIX_TIER" --max-jobs "$MATRIX_MAX_JOBS" --github-output "$GITHUB_OUTPUT"

  accept:
    needs: plan
    environment: cloud-e2e
    runs-on: [self-hosted, linux, ohbs-image-private]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      E2E_TARGET_REGION: ${{ secrets.TC_E2E_REGION }}
      E2E_TARGET_ZONE: ${{ secrets.TC_E2E_ZONE }}
      E2E_TARGET_VPC_ID: ${{ secrets.TC_E2E_VPC_ID }}
      E2E_TARGET_SUBNET_ID: ${{ secrets.TC_E2E_SUBNET_ID }}
      E2E_TARGET_SG_ID: ${{ secrets.TC_E2E_SG_ID }}
      E2E_SOURCE_IMAGE: ${{ secrets[matrix.source_secret] }}
      WINRM_PASSWORD: ${{ secrets.TC_E2E_WINRM_PASSWORD }}
    steps:
      - name: Configure isolated evidence state
        run: |
          echo "OHBS_IMAGE_STATE_DIR=$RUNNER_TEMP/ohbs-image-matrix-${{ matrix.profile }}-L${{ matrix.level }}" >> "$GITHUB_ENV"
          echo "OHBS_ACCEPTANCE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.11"}
      - uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2
        with: {version: "1.16.0"}
      - name: Authenticate with Tencent Cloud OIDC
        uses: everpcpc/tencentcloud-oidc-auth@bcc33538077d94b147dae540f7419a8cea2a60e8
        with:
          role-arn: ${{ secrets.TC_E2E_OIDC_ROLE_ARN }}
          oidc-provider-id: github
          region: ${{ secrets.TC_E2E_REGION }}
      - name: Build, clean-boot, resolve, and admission test
        id: acceptance
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$E2E_SOURCE_IMAGE"
          export "E2E_TARGET_IMAGE_${{ matrix.profile }}=$E2E_SOURCE_IMAGE"
          pip install -e ".[dev]"
          ansible-galaxy collection install -r requirements-builder.yml
          python scripts/real_e2e_test.py \
            --region "$E2E_TARGET_REGION" --zone "$E2E_TARGET_ZONE" \
            --vpc-id "$E2E_TARGET_VPC_ID" --subnet-id "$E2E_TARGET_SUBNET_ID" \
            --security-group-id "$E2E_TARGET_SG_ID" --target-mode single \
            --profile "${{ matrix.profile }}" --level "${{ matrix.level }}" --yes
          ohbs-image state verify --strict --output json > state-verification.json
      - name: Write acceptance result
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          python scripts/write_acceptance_result.py --status "$ACCEPTANCE_OUTCOME" \
            --profile "${{ matrix.profile }}" --level "${{ matrix.level }}" \
            --artifact "cloud-matrix-${{ matrix.profile }}-L${{ matrix.level }}-${{ github.run_id }}" \
            --output acceptance-result.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Archive acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cloud-matrix-${{ matrix.profile }}-L${{ matrix.level }}-${{ github.run_id }}
          path: |
            logs
            acceptance-result.json
            state-verification.json
            ${{ env.OHBS_IMAGE_STATE_DIR }}
          retention-days: 90
          if-no-files-found: warn
      - name: Enforce acceptance result
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: test "$ACCEPTANCE_OUTCOME" = "success"
