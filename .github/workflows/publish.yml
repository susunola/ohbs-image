name: publish-pypi

# Publishes ohbs-image to PyPI when a version tag (v*) is pushed.
# Authentication: prefer trusted publishing (OIDC — no token stored); if the
# project is not yet configured for it, fall back to the PYPI_TOKEN secret.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write             # required for trusted publishing
  contents: write
  attestations: write         # required for build provenance attestation

jobs:
  publish:
    # SLSA L2: pinned build environment — fixed runner image, exact Python
    # patch, and pinned build backend versions make the wheel/sdist
    # reproducible for a given commit (rebuilding the same tag yields the
    # same artifact hashes).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"

      - name: Verify release metadata
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Install pinned build tooling
        run: pip install "build==1.2.2.post1" "setuptools==75.3.0" "wheel==0.45.1"

      - name: Build wheel + sdist (no isolation — pinned backend above)
        run: python -m build --no-isolation

      - name: Generate checksums and CycloneDX SBOM
        run: python scripts/build_release_manifest.py dist

      # SLSA-style build provenance for the release artifacts themselves:
      # GitHub signs an attestation linking the wheel/sdist to this repo +
      # commit. Verify later with `gh attestation verify dist/*.whl
      # --owner susunola` — customers' security reviews can check the tool
      # that hardens their images is itself unmodified.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2, pinned 2026-08-24
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.cdx.json

      - name: Attach immutable assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      # pypa/gh-action-pypi-publish runs twine over every file in its
      # packages-dir, so dist/ must not be handed to it directly: it also holds
      # SHA256SUMS and sbom.cdx.json, and twine aborts with
      # `InvalidDistribution: Unknown distribution format: 'SHA256SUMS'` (this
      # is how v0.20.0 reached GitHub but never reached PyPI).
      - name: Isolate distributions for upload
        run: |
          mkdir -p dist-publish
          cp dist/*.whl dist/*.tar.gz dist-publish/

      - name: Verify upload directory holds only distributions
        run: python scripts/check_publish_dist.py dist-publish

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, pinned 2026-08-23
        with:
          packages-dir: dist-publish
          # Trusted publishing is used automatically when no token is given.
          # Enable it once at
          #   https://pypi.org/manage/account/publishing/
          #   (owner: the account that owns the "ohbs-image" project)
          # Otherwise create a PyPI API token and store it as PYPI_TOKEN.
          password: ${{ secrets.PYPI_TOKEN }}
