name: real-cloud-acceptance

# Deliberately manual and protected: this creates billed Tencent Cloud CVMs.
# Configure the `cloud-e2e` GitHub Environment with required reviewers and
# the TC_E2E_* secrets documented in README before enabling it.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile whose source image is supplied by TC_E2E_SOURCE_IMAGE_ID
        required: true
        default: rhel8
        type: choice
        options: [ubuntu2004, ubuntu2204, ubuntu2404, rhel8, rhel9, rhel10, tencentos3, tencentos4, win2016, win2019, win2022, win2025]
      level:
        description: CIS level
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]
      confirm_cost:
        description: I approve creation of billed CVMs for this acceptance run
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  accept:
    if: inputs.confirm_cost == true
    environment: cloud-e2e
    runs-on: [self-hosted, linux, ohbs-image-private]
    timeout-minutes: 240
    env:
      OHBS_IMAGE_STATE_DIR: ${{ runner.tool_cache }}/ohbs-image-e2e-state
      E2E_TARGET_REGION: ${{ secrets.TC_E2E_REGION }}
      E2E_TARGET_ZONE: ${{ secrets.TC_E2E_ZONE }}
      E2E_TARGET_VPC_ID: ${{ secrets.TC_E2E_VPC_ID }}
      E2E_TARGET_SUBNET_ID: ${{ secrets.TC_E2E_SUBNET_ID }}
      E2E_TARGET_SG_ID: ${{ secrets.TC_E2E_SG_ID }}
      WINRM_PASSWORD: ${{ secrets.TC_E2E_WINRM_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2 # pinned
        with:
          version: "1.16.0"
      - name: Authenticate to Tencent Cloud via OIDC
        uses: everpcpc/tencentcloud-oidc-auth@bcc33538077d94b147dae540f7419a8cea2a60e8 # v1
        with:
          role-arn: ${{ secrets.TC_E2E_OIDC_ROLE_ARN }}
          oidc-provider-id: github
          region: ${{ secrets.TC_E2E_REGION }}
      - name: Run one real build and clean-boot acceptance
        env:
          E2E_SOURCE_IMAGE: ${{ secrets.TC_E2E_SOURCE_IMAGE_ID }}
          WINRM_PASSWORD: ${{ secrets.TC_E2E_WINRM_PASSWORD }}
        run: |
          test -n "$E2E_SOURCE_IMAGE"
          export "E2E_TARGET_IMAGE_${{ inputs.profile }}=$E2E_SOURCE_IMAGE"
          pip install -e ".[dev]"
          python scripts/real_e2e_test.py \
            --region "$E2E_TARGET_REGION" --zone "$E2E_TARGET_ZONE" \
            --vpc-id "$E2E_TARGET_VPC_ID" --subnet-id "$E2E_TARGET_SUBNET_ID" \
            --security-group-id "$E2E_TARGET_SG_ID" \
            --target-mode single --profile "${{ inputs.profile }}" --level "${{ inputs.level }}" --yes
      - name: Archive real-cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: real-cloud-acceptance-${{ github.run_id }}
          path: |
            logs
            ${{ runner.tool_cache }}/ohbs-image-e2e-state
          if-no-files-found: warn
          retention-days: 90
