name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with the `Programming Language :: Python :: 3.x`
        # classifiers in pyproject.toml — every claimed version is tested.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The real Windows profile validation calls preflight, which correctly
      # refuses to run without this controller-side collection. Keep this
      # installation explicit: pywinrm alone cannot validate Windows roles.
      - name: Install Windows Ansible collection
        run: ansible-galaxy collection install -r requirements-builder.yml

      # packer is needed by the real-HCL validate tests (TestRealPackerValidate*).
      # They render every profile and run `packer validate` against the actual
      # HCL, catching template syntax regressions (e.g. `map(any)` variables or a
      # leftover substitution token inside a comment) that unit tests cannot see.
      - name: Install packer
        uses: hashicorp/setup-packer@c4e4b2636b98ce7566f9ec9c309e26821f695bd2 # main, pinned 2026-08-23
        with:
          version: "1.16.0"

      - name: Run ruff (lint)
        # Tests are linted too — a dead variable or broken import in tests/
        # previously reached main because CI only checked ohbs_image/.
        run: ruff check ohbs_image tests

      - name: Run mypy (type-check)
        run: mypy ohbs_image --ignore-missing-imports

      # Version single-source guard: ohbs_image/_logging.py VERSION must equal
      # what the installed CLI reports (rebuild.sh relies on the same check).
      - name: Verify version single-source
        run: |
          CODE_VERSION=$(grep -m1 '^VERSION = ' ohbs_image/_logging.py | sed 's/^VERSION = "//;s/"$//')
          BIN_VERSION=$(ohbs-image --version | awk '{print $2}')
          echo "code version: $CODE_VERSION | binary version: $BIN_VERSION"
          test "$CODE_VERSION" = "$BIN_VERSION"

      # README freshness guard: scripts/check_readme.py verifies every
      # subcommand the CLI registers and every OS profile is documented in
      # README.md, and that tests/test_check_readme.py's ALL_CMDS matches the
      # live CLI. --check-translations additionally fails CI when a translated
      # README (zh-CN / ja / th) references a command that no longer exists,
      # so renames/removals can't leave stale references in another language.
      # (Translations are condensed quick-start docs by design — full
      # subcommand coverage is only enforced for the English README.)
      - name: Verify README documents every subcommand and profile
        run: python3 scripts/check_readme.py --check-tests --check-translations

      - name: Verify documentation links and CLI examples
        run: python3 scripts/check_docs.py

      # rules.json canonical-format guard: every role's rules.json must use the
      # single canonical layout produced by scripts/format_rules.py. This keeps
      # bulk edits minimal and stops hand-edits from silently re-diverging into
      # the 2-space/4-space split we had before.
      - name: Verify rules.json canonical format
        run: python3 scripts/format_rules.py --check

      # Delivery reports merge rules.json + guidance.json + runtime evidence.
      # Validate that relationship independently of the CLI test suite.
      - name: Verify catalog and CIS guidance integrity
        run: python3 scripts/check_catalog_guidance.py

      # Role payloads are self-contained for Ansible, but their engines have
      # shared ownership. Fail fast if a bulk fix lands in only some profiles.
      - name: Verify shared engine payloads have not drifted
        run: |
          python3 scripts/generate_engines.py
          python3 scripts/check_engine_drift.py

      # Exercise the CLI supply-chain gates against the checked-out roles.
      # The unit suite mocks profiles and state; this step runs the shipped
      # commands on the real bundled data, catching runtime regressions
      # (schema refs, profile-name drift, format changes) mocks cannot see.
      # The script gates above stay: they enforce invariants the CLI does not
      # (cross-role engine sha256 drift, numeric CIS rule ordering).
      - name: Verify CLI supply-chain gates
        run: |
          ohbs-image engine verify
          ohbs-image catalog verify

      - name: Run tests (with coverage gate)
        # Coverage is gated by [tool.coverage.report] fail_under=80 (measured
        # baseline 83% with the vendored roles/ omitted): a regression floor,
        # not a target — it fails on a meaningful drop while tolerating the
        # ±2-3% jitter of the real-IO tests. The per-module numbers still
        # show which modules are risky to touch.
        run: pytest -v --tb=short --cov=ohbs_image --cov-report=term-missing

  # Separate job: dependency vulnerability scan (runs once, on the newest
  # interpreter). The runtime is stdlib-only; this guards the dev extras
  # (ansible-core, pywinrm, tooling) used by the build controller.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit
