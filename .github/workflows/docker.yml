name: Docker

# Builds the check_readme.py Docker image (see Dockerfile) and verifies the
# packaged artifact is complete and behaves correctly inside the container.
# This guards the README-freshness check in a clean, reproducible Python
# environment and catches packaging regressions (missing submodules / roles)
# that a source-checkout-only CI wouldn't.
#
# No cloud credentials are needed — this is pure local validation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker build runs check_readme.py as the image entrypoint during the
      # final stage test, so a successful build already proves README.md is
      # current. We also re-run it explicitly below for a clear signal.
      - name: Build Docker image
        run: docker build --target check-readme -t ohbs-image:check-readme .

      - name: Verify README check inside container
        run: docker run --rm ohbs-image:check-readme

      - name: Verify packaged artifact (version / submodules / roles)
        run: |
          docker run --rm --entrypoint python3 ohbs-image:check-readme -c '
          import os, ohbs_image

          # 1) version single-source
          assert ohbs_image.VERSION, "missing VERSION"

          # 2) every split submodule present
          for m in ["_tc_cloud", "_commands", "_config", "_render", "_cli",
                    "_audit", "_reports", "_packer", "_profiles", "_templates",
                    "_logging"]:
              assert hasattr(ohbs_image, m), f"missing submodule {m}"

          # 3) every bundled OS role shipped (package-data)
          roles_dir = os.path.join(os.path.dirname(ohbs_image.__file__), "roles")
          roles = sorted(os.listdir(roles_dir))
          assert len(roles) == 13, f"expected 13 roles, got {len(roles)}: {roles}"

          # spot-check a role data file made it into the wheel
          rp = os.path.join(roles_dir, "cis-tencentos4", "files", "rules.json")
          assert os.path.exists(rp), "missing roles package-data"

          print(f"packaged artifact OK: v{ohbs_image.VERSION}, "
                f"{len(roles)} roles, all submodules present")
          '

      - name: Build production server image
        run: docker build --target server -t ohbs-image:server .

      - name: Verify non-root production image metadata
        run: |
          test "$(docker image inspect ohbs-image:server --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect ohbs-image:server --format '{{json .Config.Healthcheck.Test}}')" != "null"

  # 6a: build the actual wheel with the same pinned backend as publish.yml,
  # then install it into a clean python:3.11-slim container and smoke-test
  # version/help/payload completeness. This catches packaging regressions
  # (missing roles package-data, broken entry points, stale payload counts)
  # that a source-checkout-only job cannot see.
  wheel-install-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel (pinned backend, same as publish.yml)
        run: |
          pip install --quiet "build==1.2.2.post1" "setuptools==75.3.0" "wheel==0.45.1"
          python -m build --no-isolation --wheel --outdir dist

      - name: Verify wheel installs and runs in a clean container
        run: |
          EXPECT_ROLES=$(ls ohbs_image/roles | wc -l | tr -d ' ')
          echo "expecting ${EXPECT_ROLES} role payloads in the wheel"
          scripts/verify_wheel_in_container.sh dist/ohbs_image-*.whl "${EXPECT_ROLES}"
