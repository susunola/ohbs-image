[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ohbs-image-example-scanner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ohbs-image>=0.19,<1.0"]

[project.entry-points."ohbs_image.scanners"]
example = "ohbs_image_example_scanner:ExampleScanner"

[tool.setuptools]
py-modules = ["ohbs_image_example_scanner"]
